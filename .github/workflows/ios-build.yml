name: Build unsigned iOS IPA

# Runs on a GitHub-hosted macOS machine, because iOS compilation needs Xcode
# and Xcode does not exist on Windows. The output is an UNSIGNED .ipa — sign
# and install it from Windows with Sideloadly or AltStore using a free Apple ID.

on:
  workflow_dispatch: # lets you press "Run workflow" by hand
  push:
    branches: [main]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Report versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true # informational; never blocks the build

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into an IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qq -r HabitLedger-unsigned.ipa Payload
          ls -lh HabitLedger-unsigned.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: HabitLedger-unsigned-ipa
          path: build/ios/iphoneos/HabitLedger-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
